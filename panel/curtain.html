<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>mywebview 緞帳</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; cursor: none; }
  /* 幕。開いているときは上に上がりきって見えない。閉めると下りてくる */
  #c {
    position: absolute; inset: 0; transform: translateY(-100%);
    transition: transform 2.5s cubic-bezier(.45, 0, .25, 1);
    /* 画像が無いときの幕: 赤いビロードのひだ */
    background:
      linear-gradient(to bottom, rgba(0,0,0,.35), transparent 12%, transparent 88%, rgba(0,0,0,.45)),
      repeating-linear-gradient(90deg,
        #4a0008 0, #8c0f1c 2.2%, #b3192b 3.4%, #8c0f1c 4.6%, #4a0008 6.5%);
  }
  #c.closed { transform: translateY(0); }
  #c.image { background: #000 center / cover no-repeat; }
  /* 裾の影（下りてくるときに、裏の内容との境目を分かりやすくする） */
  #c::after {
    content: ''; position: absolute; left: 0; right: 0; top: 100%; height: 24px;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
  }
</style>
</head>
<body>
  <div id="c"></div>
  <script src="curtain.js"></script>
</body>
</html>
